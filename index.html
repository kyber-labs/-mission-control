<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mission Control</title>
<style>
:root{
  --bg:#171009; --card:#241a12; --border:#4a3220; --text:#f5e9d5; --muted:#b09a7a;
  --green:#34d399; --red:#ef4444; --yellow:#f59e0b; --blue:#38bdf8; --purple:#a855f7;
  --radius:16px; --topbar-h:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--blue)}
#app{display:flex;min-height:100vh}
/* ---------- Sidebar ---------- */
#sidebar{width:250px;flex-shrink:0;background:#0e1628;border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:700;letter-spacing:.14em;font-size:13px}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#1b2947,#101a30);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13.5px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav-btn:hover{background:#16223c;color:var(--text)}
.nav-btn.active{background:#1a2a4a;color:var(--text);font-weight:600}
.nav-ico{width:20px;text-align:center;font-size:15px}
.nav-badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#1a2a4a;color:var(--text);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.nav-badge.hot{background:rgba(245,158,11,.18);color:var(--yellow)}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border)}
#scrim{display:none}
/* ---------- Main / topbar ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--border);background:rgba(11,17,32,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:50}
#burger{display:none;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;width:36px;height:36px;cursor:pointer}
.tb-title{font-weight:700;letter-spacing:.16em;font-size:13px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.conn-dot{width:9px;height:9px;border-radius:50%;background:var(--yellow)}
.conn.up .conn-dot{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.7)}
.conn.down .conn-dot{background:var(--red)}
.clock{font-size:13px;color:var(--muted)}
#content{flex:1;padding:24px;max-width:1280px;width:100%;margin:0 auto}
.view{display:none}
.view.active{display:block}
/* ---------- Generic UI ---------- */
.h{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;border:1px solid #2a3a5c;background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:#16223c;border-color:#3a4f7d}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:#38bdf8;color:#081120;border-color:#38bdf8}
.btn-primary:hover{background:#0ea5e9;border-color:#0ea5e9}
.btn-danger-ghost{border-color:#7f3a3a;color:#f87171}
.btn-danger-ghost.armed{background:rgba(239,68,68,.18);border-color:#b45353;color:#fca5a5}
.pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pill.working{background:rgba(56,189,248,.14);color:var(--blue);border:1px solid rgba(56,189,248,.35)}
.pill.idle{background:#1a2a4a;color:var(--muted);border:1px solid var(--border)}
.pill.paused{background:rgba(245,158,11,.14);color:var(--yellow);border:1px solid rgba(245,158,11,.4)}
.pill.on{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.35)}
.pill.off{background:#1a2a4a;color:var(--muted);border:1px solid var(--border)}
.pill.online{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.35)}
.pill.offline{background:rgba(239,68,68,.14);color:var(--red);border:1px solid rgba(239,68,68,.4)}
.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);background:var(--card)}
.empty .big{font-size:30px;margin-bottom:10px}
.empty-inline{color:var(--muted);font-size:13px;padding:6px 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bar{height:8px;border-radius:5px;background:#1a2a4a;overflow:hidden;margin-top:8px}
.bar-fill{height:100%;border-radius:5px;background:var(--blue);transition:width .5s}
.bar-fill.danger{background:var(--red)}
.bar-fill.warn{background:var(--yellow)}
.code-block{background:#0d1526;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#c7d2e8;white-space:pre-wrap;word-break:break-word;margin:12px 0}
#toast{position:fixed;top:calc(var(--topbar-h) + 12px);right:16px;z-index:200;background:#111a2e;border:1px solid var(--border);border-left:3px solid var(--red);border-radius:10px;padding:12px 16px;font-size:13px;max-width:340px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.5)}
/* ---------- Agent cards ---------- */
.agent-card{display:flex;flex-direction:column;gap:12px}
.agent-head{display:flex;align-items:center;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.agent-name{font-weight:700;font-size:15px}
.agent-role{font-size:12.5px;color:var(--muted)}
.agent-head .pill{margin-left:auto}
.task-box{background:#0d1526;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:58px}
.task-title{font-weight:600;font-size:13.5px}
.task-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
/* ---------- Queue ---------- */
.q-item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border)}
.q-item:last-child{border-bottom:0}
.q-num{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:#1a2a4a;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;color:var(--muted)}
.q-prompt{flex:1;white-space:pre-wrap;word-break:break-word}
.q-meta{font-size:11.5px;color:var(--muted);margin-top:6px}
.q-form{display:flex;flex-direction:column;gap:12px}
textarea,select,input[type=text]{background:#0d1526;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 13px;font-size:13.5px;font-family:inherit;width:100%}
textarea{min-height:96px;resize:vertical}
textarea:focus,select:focus{outline:none;border-color:#38bdf8}
.quick-row{display:flex;flex-wrap:wrap;gap:8px}
.sec-title{font-size:15px;font-weight:700;margin:26px 0 12px}
.sec-title:first-child{margin-top:0}
/* ---------- Metrics / VPS ---------- */
.metric-big{font-size:30px;font-weight:700;letter-spacing:-.01em}
.metric-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.metric-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.metric-row:last-child{border-bottom:0}
.metric-row .k{color:var(--muted)}
.metric-row .v{font-weight:600}
details.sys{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:6px 18px;margin-top:14px}
details.sys summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sched-item{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.sched-item:last-child{border-bottom:0}
.sched-title{font-weight:600}
.sched-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.sched-next{font-size:12.5px;margin-top:6px;color:var(--text)}
.sched-item .pill{margin-left:auto;flex-shrink:0}
/* ---------- Token ---------- */
.token-empty{text-align:center;max-width:560px;margin:0 auto;padding:48px 28px}
.token-icon{font-size:44px;margin-bottom:14px;opacity:.85}
.token-empty h3{margin:0 0 10px;font-size:17px}
.token-empty p{color:var(--muted);margin:8px 0}
/* ---------- Fleet ---------- */
.cap-list{margin:10px 0 0;padding-left:18px;color:#9fb0d0;font-size:13px}
.cap-list li{margin:4px 0}
.visual-note{margin-top:12px;padding:10px 12px;background:#0d1526;border:1px solid var(--border);border-radius:10px;font-size:12.5px;color:var(--muted)}
/* ---------- Log ---------- */
.log-list{display:flex;flex-direction:column;gap:2px}
.log-line{padding:8px 12px;background:#0d1526;border:1px solid var(--border);border-radius:8px;font-size:12.5px;color:#c7d2e8;word-break:break-word}
/* ---------- 3D office ---------- */
#view-office{padding:0}
#gl-wrap{position:relative;width:100%;height:calc(100vh - var(--topbar-h) - 48px);min-height:560px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#0b1120}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#office-hud{position:absolute;top:12px;left:12px;background:rgba(30,20,12,.85);border:1px solid rgba(220,180,120,.18);border-radius:10px;padding:8px 13px;font-size:12.5px;color:var(--muted);pointer-events:none;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#office-hud b{color:var(--text)}
.office-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(30,20,12,.85);border:1px solid rgba(220,180,120,.18);border-radius:999px;padding:7px 16px;font-size:11.5px;color:var(--muted);pointer-events:none;white-space:nowrap;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.gl-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:30px;text-align:center}
/* ---------- Responsive ---------- */
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .25s ease;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  body.nav-open #sidebar{transform:translateX(0)}
  body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  #burger{display:flex;align-items:center;justify-content:center}
  #content{padding:16px}
  .clock{display:none}
}
@media (max-width:768px){
  body.office-active{overflow:hidden}
  body.office-active #content{padding:0;max-width:none}
  body.office-active #gl-wrap{position:fixed;top:var(--topbar-h);left:0;width:100dvw;height:calc(100dvh - var(--topbar-h));border:0;border-radius:0;z-index:40}
  .office-hint{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="brand-mark">◈</span> MISSION CONTROL</div>
    <nav id="nav"></nav>
    <div class="side-foot">Poll tiap 3 detik · <span id="side-conn">menghubungkan…</span></div>
  </aside>
  <div id="scrim"></div>
  <div id="main">
    <header id="topbar">
      <button id="burger" aria-label="Buka menu">☰</button>
      <div class="tb-title">MISSION CONTROL</div>
      <div class="tb-right">
        <span id="conn" class="conn"><span class="conn-dot"></span><span id="conn-text">Menghubungkan…</span></span>
        <span id="clock" class="clock mono">--:--:--</span>
        <button id="dispatch-btn" class="btn btn-danger-ghost" onclick="toggleDispatch()">⏸ Pause</button>
      </div>
    </header>
    <main id="content">
      <section class="view active" id="view-office">
        <div id="gl-wrap">
          <canvas id="gl"></canvas>
          <div id="office-hud">memuat…</div>
          <div class="office-hint">Seret untuk memutar · scroll / cubit untuk zoom · klik figur untuk jeda / lanjut</div>
        </div>
      </section>
      <section class="view" id="view-agents"></section>
      <section class="view" id="view-queue"></section>
      <section class="view" id="view-metrics"></section>
      <section class="view" id="view-vps"></section>
      <section class="view" id="view-schedules"></section>
      <section class="view" id="view-token"></section>
      <section class="view" id="view-fleet"></section>
      <section class="view" id="view-log"></section>
    </main>
  </div>
</div>
<div id="toast"></div>
<script src="/vendor/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   MISSION CONTROL — frontend dashboard monitoring AI agent
   ============================================================ */
const $ = (s) => document.querySelector(s);

function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fmtTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Jakarta" });
}
function fmtDT(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Jakarta" });
}
function loadingHTML() { return '<div class="empty"><div class="big">⏳</div>Memuat data dari server…</div>'; }

/* ---------------- Roster (statis, sesuai konfigurasi) ---------------- */
const ROSTER = [
  { id: "Anca", role: "Project Manager / General", color: 0x38bdf8, css: "#38bdf8", muted: 0x5b7fa6,
    caps: ["Koordinasi & delegasi task antar-agent", "Monitoring progres dan status", "General purpose / serbaguna"],
    visual: "Figur voxel berkepala kubus, rambut dan pakaian biru muted, tanpa aksesori khusus." },
  { id: "Mu", role: "Graphic Designer", color: 0xa855f7, css: "#a855f7", muted: 0x8a7bb8,
    caps: ["Desain grafis & ilustrasi", "Komposisi visual & layout", "Aset gambar untuk konten"],
    visual: "Figur voxel berkepala kubus, rambut ungu muted dengan baret ungu miring, stylus di tangan kanan, drawing tablet di atas meja." },
  { id: "Cipu", role: "Video Editor", color: 0xef4444, css: "#ef4444", muted: 0xc96f5e,
    caps: ["Editing & cutting video", "Color grading dasar", "Render & ekspor"],
    visual: "Figur voxel berkepala kubus, rambut merah muted dengan headphone merah dan lampu indikator REC yang berkedip." },
  { id: "Jaka", role: "QC Visual", color: 0x22d3ee, css: "#22d3ee", muted: 0x6fae7a,
    caps: ["Quality control visual", "Review detail & ketelitian", "Verifikasi hasil akhir"],
    visual: "Figur voxel berkepala kubus, rambut hijau muted dengan kamera kotak kecil di dada (lensa berdenyut saat memeriksa) dan kacamata." },
  { id: "Tono", role: "Riset", color: 0xf59e0b, css: "#f59e0b", muted: 0xd9b36a,
    caps: ["Riset & pengumpulan informasi", "Analisis & sintesis temuan", "Laporan hasil riset"],
    visual: "Figur voxel berkepala kubus, rambut pirang bertopi kuning, kaca pembesar kotak di tangan." },
  { id: "Dani", role: "Coding", color: 0x34d399, css: "#34d399", muted: 0x5aa8a0,
    caps: ["Penulisan & perbaikan kode", "Debugging", "Implementasi fitur"],
    visual: "Figur voxel berkepala kubus, rambut teal muted dengan keyboard mini di atas meja." }
];

const VIEWS = [
  { id: "office",    label: "Virtual Office",  icon: "🏢" },
  { id: "agents",    label: "Agent Overview",  icon: "🤖" },
  { id: "queue",     label: "Task Queue",      icon: "📥", badge: true },
  { id: "metrics",   label: "System Metrics",  icon: "📊" },
  { id: "vps",       label: "VPS Status",      icon: "🖥️" },
  { id: "schedules", label: "Tugas Terjadwal", icon: "🗓️" },
  { id: "token",     label: "Token Status",    icon: "🔑" },
  { id: "fleet",     label: "Agent Fleet",     icon: "👥" },
  { id: "log",       label: "Real-Time Log",   icon: "📜" }
];

/* ---------------- State & polling ---------------- */
let state = null, prevState = null, connected = false, activeView = "office", polling = false;

function effPaused(a) {
  if (!a) return false;
  return !!(a.paused || (state && state.paused_agents && state.paused_agents[a.id]));
}

async function apiPost(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({ ok: false, error: "Respons server tidak valid" }));
    if (!r.ok || !d.ok) { toast("Gagal: " + (d.error || ("HTTP " + r.status))); return false; }
    return true;
  } catch (e) { toast("Gagal terhubung ke server"); return false; }
}

function detectCheer(prev, cur) {
  if (!prev || !cur || !Array.isArray(prev.tasks) || !Array.isArray(cur.tasks)) return;
  const m = {};
  prev.tasks.forEach((t) => { if (t && t.task_id) m[t.task_id] = t.status; });
  cur.tasks.forEach((t) => {
    const p = t && t.task_id ? m[t.task_id] : undefined;
    if ((p === "started" || p === "progress") && t.status === "done" && t.agent && typeof figures3D !== "undefined" && figures3D[t.agent]) {
      figures3D[t.agent].hop = 2; figures3D[t.agent].hopT = 0;
    }
  });
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    prevState = state; state = d; connected = !!d.ok;
    detectCheer(prevState, state);
  } catch (e) { connected = false; }
  polling = false;
  renderChrome(); renderActive(); syncFigures();
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = "none"; }, 3500);
}

/* ---------------- Navigasi ---------------- */
function buildNav() {
  $("#nav").innerHTML = VIEWS.map((v) =>
    '<button class="nav-btn' + (v.id === activeView ? " active" : "") + '" data-view="' + v.id + '" onclick="switchView(\'' + v.id + '\')">' +
    '<span class="nav-ico">' + v.icon + "</span><span>" + esc(v.label) + "</span>" +
    (v.badge ? '<span class="nav-badge" id="nav-badge-queue">0</span>' : "") + "</button>"
  ).join("");
}
function switchView(id) {
  activeView = id;
  document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.view === id));
  document.querySelectorAll(".view").forEach((s) => s.classList.toggle("active", s.id === "view-" + id));
  document.body.classList.remove("nav-open");
  updateOfficeMode(); renderActive(); onResize3D();
}
function updateOfficeMode() {
  document.body.classList.toggle("office-active", activeView === "office" && window.innerWidth <= 768);
}
window.addEventListener("resize", () => { updateOfficeMode(); onResize3D(); });
$("#burger").addEventListener("click", () => document.body.classList.toggle("nav-open"));
$("#scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));

/* ---------------- Chrome (topbar/sidebar/HUD) ---------------- */
function tickClock() {
  $("#clock").textContent = new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Asia/Jakarta" }) + " WIB";
}
function renderChrome() {
  const c = $("#conn");
  c.classList.toggle("up", connected); c.classList.toggle("down", !connected);
  $("#conn-text").textContent = connected ? "Terhubung" : "Terputus — mencoba lagi…";
  $("#side-conn").textContent = connected ? "terhubung" : "terputus";
  const q = state && Array.isArray(state.queue) ? state.queue.length : 0;
  const b = $("#nav-badge-queue");
  if (b) { b.textContent = q; b.classList.toggle("hot", q > 0); }
  const db = $("#dispatch-btn");
  const paused = !!(state && state.dispatch_paused);
  db.innerHTML = paused ? "▶ Resume" : "⏸ Pause";
  db.classList.toggle("armed", paused);
  db.title = paused ? "Dispatch sedang dijeda — klik untuk lanjutkan" : "Jeda dispatch global";
  // HUD 3D

  const idx = ROSTER.findIndex((r) => r.id === cfg.id);
  const skinMat = new THREE.MeshStandardMaterial({ color: SKIN_TONES[idx < 0 ? 0 : idx], roughness: 0.6 });
  const hairMat = new THREE.MeshStandardMaterial({ color: cfg.muted, roughness: 0.7 });
  const clothMat = new THREE.MeshStandardMaterial({ color: cfg.muted, roughness: 0.6 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x3a404c, roughness: 0.7, metalness: 0.25 });
  const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x14161c, roughness: 0.3 });
  const P = {};

  /* Badan: pinggul + torso kotak pakaian muted + panel dada + leher kotak. */
  const hips = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.25, 0.35), darkMat); hips.position.y = 0.72; g.add(hips);
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.32), clothMat); torso.position.y = 1.15; g.add(torso);
  const chestPanel = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.04), whiteMat); chestPanel.position.set(0, 1.25, 0.18); g.add(chestPanel);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.14, 0.16), skinMat); neck.position.y = 1.57; g.add(neck);

  /* Kepala: kubus kulit + topi rambut kotak + mata kotak (kedip via scale). */
  const headG = new THREE.Group(); headG.position.y = 1.86; g.add(headG); P.headG = headG;
  headG.add(new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.52, 0.52), skinMat));
  const hairCap = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.16, 0.56), hairMat);
  hairCap.position.y = 0.26; headG.add(hairCap);
  const hairBack = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.34, 0.1), hairMat);
  hairBack.position.set(0, 0.06, -0.24); headG.add(hairBack);
  const mkEye = (sx) => {
    const e = new THREE.Group(); e.position.set(0.12 * sx, 0.02, 0.27);
    e.add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.11, 0.02), pupilMat));
    headG.add(e); return e;
  };
  P.eyeL = mkEye(-1); P.eyeR = mkEye(1);

  /* Lengan: pivot bahu, lengan kotak pakaian muted, tangan kotak kulit. */
  const mkArm = (sx) => {
    const piv = new THREE.Group(); piv.position.set(0.36 * sx, 1.48, 0);
    const a = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.5, 0.14), clothMat); a.position.y = -0.25; piv.add(a);
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.14, 0.15), skinMat); hand.position.y = -0.52; piv.add(hand);
    g.add(piv); return piv;
  };
  P.armL = mkArm(-1); P.armR = mkArm(1);

  /* Kaki: paha (pivot pinggul) + betis (pivot lutut) + sepatu kotak.
     Sudutnya di-lerp di animate(): duduk = paha -1,35 / betis +1,35. */
  const mkLeg = (sx) => {
    const thigh = new THREE.Group(); thigh.position.set(0.16 * sx, 0.72, 0); g.add(thigh);
    const th = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.34, 0.17), darkMat); th.position.y = -0.17; thigh.add(th);
    const knee = new THREE.Group(); knee.position.y = -0.34; thigh.add(knee);
    const sh = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.34, 0.15), darkMat); sh.position.y = -0.17; knee.add(sh);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.09, 0.28), darkMat); foot.position.set(0, -0.36, 0.05); knee.add(foot);
    return { thigh, knee };
  };
  const legL = mkLeg(-1), legR = mkLeg(1);
  P.thighL = legL.thigh; P.kneeL = legL.knee; P.thighR = legR.thigh; P.kneeR = legR.knee;

  /* Cangkir di tangan kanan — hanya terlihat saat kegiatan "sip" (v5.1). */
  const handMug = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.12),
    new THREE.MeshStandardMaterial({ color: 0xd9c9a8, roughness: 0.5 }));
  handMug.position.set(0, -0.56, 0.08); handMug.visible = false;
  P.armR.add(handMug); P.handMug = handMug;
  /* Buku kecil di depan dada — hanya terlihat saat kegiatan "read" (v8). */
  const book = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.05, 0.24),
    new THREE.MeshStandardMaterial({ color: 0x8a5a2e, roughness: 0.6 }));
  book.position.set(0, 1.12, 0.3); book.visible = false;
  g.add(book); P.book = book;

  /* --- Aksesori per agent (semua kotak) --- */
  if (cfg.id === "Mu") {
    const beret = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.5),
      new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.6 }));
    beret.position.set(-0.08, 0.36, -0.04); beret.rotation.z = 0.28; beret.rotation.x = -0.1; headG.add(beret);
    const bun = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), hairMat);
    bun.position.set(-0.12, 0.34, -0.1); headG.add(bun);
    const stylus = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.42, 0.05),
      new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.4 }));
    stylus.position.set(0, -0.52, 0.1); stylus.rotation.x = 0.5; P.armR.add(stylus);
    const tablet = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.04, 0.5),
      new THREE.MeshStandardMaterial({ color: 0x1c1c21, roughness: 0.4 }));
    tablet.position.set(0, 1.02, 0.62); tablet.rotation.x = -0.22; g.add(tablet);
  }
  if (cfg.id === "Cipu") {
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.6), darkMat);
    band.position.y = 0.3; headG.add(band);
    [-1, 1].forEach((sx) => {
      const cup = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.2),
        new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5 }));
      cup.position.set(0.3 * sx, 0, 0); headG.add(cup);
    });
    P.recMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.6 });
    const rec = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.09), P.recMat);
    rec.position.set(0.2, 0.36, 0.12); headG.add(rec);
  }
  if (cfg.id === "Jaka") {
    /* Kamera kotak di dada (lensa berdenyut saat memeriksa) + kacamata. */
    const lensG = new THREE.Group(); lensG.position.set(0, 1.32, 0.28); g.add(lensG); P.lensG = lensG;
    const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.26, 0.22), darkMat);
    lensG.add(barrel);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.18),
      new THREE.MeshStandardMaterial({ color: 0x0e1626, roughness: 0.15, metalness: 0.65 }));
    glass.position.z = 0.12; lensG.add(glass);
    const glint = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.05),
      new THREE.MeshBasicMaterial({ color: 0xbfe9ff }));
    glint.position.set(0.04, 0.04, 0.122); lensG.add(glint);
    [-1, 1].forEach((sx) => {
      const rim = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, 0.02), darkMat);
      rim.position.set(0.12 * sx, 0.1, 0.28); headG.add(rim);
    });
  }
  if (cfg.id === "Tono") {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.12, 0.54),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.6 }));
    cap.position.set(0, 0.3, 0); headG.add(cap);
    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.03, 0.22),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.6 }));
    brim.position.set(0, 0.26, 0.3); headG.add(brim);
    const ant = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.4, 0.04), darkMat);
    ant.position.set(0.16, 0.5, 0); headG.add(ant);
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 1.2 }));
    tip.position.set(0.16, 0.72, 0); headG.add(tip);
    const mag = new THREE.Group();
    const magMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });
    const magTop = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.04), magMat); magTop.position.y = 0.15; mag.add(magTop);
    const magBot = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.04), magMat); magBot.position.y = -0.15; mag.add(magBot);
    const magL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.04), magMat); magL.position.x = -0.15; mag.add(magL);
    const magR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.04), magMat); magR.position.x = 0.15; mag.add(magR);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.05), darkMat);
    handle.position.y = -0.28; mag.add(handle);
    mag.position.set(0, -0.55, 0.14); P.armR.add(mag);
  }
  if (cfg.id === "Dani") {
    const kb = new THREE.Group();
    kb.add(new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.06, 0.36),
      new THREE.MeshStandardMaterial({ color: 0x1c1c21, roughness: 0.5 })));
    const keyMat = new THREE.MeshStandardMaterial({ color: 0x34d399, roughness: 0.4, emissive: 0x34d399, emissiveIntensity: 0.25 });
    for (let rI = 0; rI < 2; rI++) for (let cI = 0; cI < 5; cI++) {
      const key = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.035, 0.1), keyMat);
      key.position.set(-0.34 + cI * 0.17, 0.045, -0.07 + rI * 0.16); kb.add(key);
    }
    kb.position.set(0, 1.0, 0.95); g.add(kb);
  }

  /* Cincin status di lantai — dibuat di SCENE (bukan anak grup),
     supaya tidak ikut tenggelam saat figur duduk.
     Posisi x/z-nya diperbarui tiap frame di animate(). */
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.55, 0.74, 40),
    new THREE.MeshBasicMaterial({ color: cfg.color, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; scene.add(ring); P.ring = ring;
  /* Bayangan: hanya di desktop (shadowsOn), agar HP tidak berat. */
  if (shadowsOn) g.traverse((o) => { if (o.isMesh) o.castShadow = true; });

  g.userData = {
    agentId: cfg.id, parts: P, phase: Math.random() * Math.PI * 2,
    working: false, paused: false, hop: 0, hopT: 0,
    leisure: "", leisureT: 0, leisureNext: 2 + Math.random() * 4, chatRotY: 0,
    spot: null, spotLegs: [], spotArrived: false, sitting: false, walkT: 0,
    blinkT: 1 + Math.random() * 3, blinkUntil: 0, label: null,
    bubble: null, bubbleKey: "",
    target: { pos: new THREE.Vector3(deskOf(cfg).x, 0, deskOf(cfg).row.idleZ), rotY: 0 }
  };
  const d0 = deskOf(cfg);
  g.position.set(d0.x, 0, d0.row.idleZ);
  refreshLabel(g, cfg);
  return g;
}

/* ---------- Ruangan ---------- */
function drawFloorTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 352;
  const x = c.getContext("2d");
  /* Papan kayu hangat (v8 kabin): baris papan berselang-seling + serat tipis. */
  const cols = ["#8a6238", "#7a5230", "#96683c", "#6e4526"];
  const th = 44;
  for (let ty = 0; ty < 8; ty++) {
    const off = (ty % 2) * 128;
    for (let tx = -1; tx < 3; tx++) {
      const sx = tx * 256 + off;
      x.fillStyle = cols[(Math.abs(tx) + ty) % 4];
      x.fillRect(sx, ty * th, 256, th);
      x.strokeStyle = "#4a2f18"; x.lineWidth = 2;
      x.beginPath(); x.moveTo(sx, ty * th); x.lineTo(sx, (ty + 1) * th); x.stroke();
    }
  }
  x.strokeStyle = "#4a2f18"; x.lineWidth = 2;
  for (let j = 0; j <= 8; j++) { x.beginPath(); x.moveTo(0, j * th); x.lineTo(512, j * th); x.stroke(); }
  x.strokeStyle = "rgba(74,47,24,0.5)"; x.lineWidth = 1;
  for (let gI = 0; gI < 40; gI++) { // serat kayu tipis
    const gy = Math.random() * 352, gx = Math.random() * 512;
    x.beginPath(); x.moveTo(gx, gy); x.lineTo(gx + 30 + Math.random() * 60, gy); x.stroke();
  }
  return new THREE.CanvasTexture(c);
}
function drawRugTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 352;
  const x = c.getContext("2d");
  /* Karpet anyam hangat (v8 kabin): bidang terakota + bordir krem + wajik. */
  x.fillStyle = "#9c5a34"; x.fillRect(0, 0, 512, 352);
  x.strokeStyle = "#d9c9a8"; x.lineWidth = 10; x.strokeRect(10, 10, 492, 332);
  x.strokeStyle = "#6e3a1e"; x.lineWidth = 4; x.strokeRect(28, 28, 456, 296);
  const diamond = (cx, cy, s, col) => {
    x.fillStyle = col; x.beginPath();
    x.moveTo(cx, cy - s); x.lineTo(cx + s, cy); x.lineTo(cx, cy + s); x.lineTo(cx - s, cy);
    x.closePath(); x.fill();
  };
  for (let ry = 0; ry < 3; ry++) for (let rx = 0; rx < 4; rx++) {
    diamond(96 + rx * 106, 88 + ry * 88, 26, (rx + ry) % 2 ? "#d9c9a8" : "#6e3a1e");
    diamond(96 + rx * 106, 88 + ry * 88, 12, (rx + ry) % 2 ? "#6e3a1e" : "#d9c9a8");
  }
  return new THREE.CanvasTexture(c);
}
function drawMountainTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 256;
  const x = c.getContext("2d");
  /* Senja pegunungan (v8 kabin): langit jingga-ungu + 2 lapis gunung + pinus. */
  const gr = x.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, "#1e2a4a"); gr.addColorStop(0.55, "#7a5a7a"); gr.addColorStop(1, "#e8956b");
  x.fillStyle = gr; x.fillRect(0, 0, 512, 256);
  x.fillStyle = "#f4f1de"; x.beginPath(); x.arc(440, 42, 14, 0, 7); x.fill(); // bulan
  for (let i = 0; i < 30; i++) { // bintang
    x.fillStyle = "rgba(255,255,255," + (0.3 + Math.random() * 0.5) + ")";
    x.fillRect(Math.random() * 512, Math.random() * 90, 2, 2);
  }
  const ridge = (color, peaks) => {
    x.fillStyle = color; x.beginPath(); x.moveTo(0, 256);
    peaks.forEach(([px, py]) => x.lineTo(px, py));
    x.lineTo(512, 256); x.closePath(); x.fill();
  };
  ridge("#3a3a5e", [[0, 150], [80, 90], [160, 140], [260, 70], [340, 130], [430, 85], [512, 140]]);
  ridge("#1e1e38", [[0, 190], [100, 120], [200, 175], [300, 110], [400, 170], [512, 125]]);
  for (let i = 0; i < 9; i++) { // pinus di kaki gunung
    const px = 20 + i * 56, ph = 26 + (i * 13) % 18;
    x.fillStyle = "#14142a";
    x.beginPath(); x.moveTo(px, 256 - ph); x.lineTo(px - 9, 256); x.lineTo(px + 9, 256); x.closePath(); x.fill();
  }
  return new THREE.CanvasTexture(c);
}
function initCodeMonitor() {
  codeCanvas = document.createElement("canvas"); codeCanvas.width = 320; codeCanvas.height = 200;
  codeTex = new THREE.CanvasTexture(codeCanvas);
  const seeds = ["const task = await dispatch(q);", "function render(state) {", "  return agents.map(sync);", "}",
    "// poll setiap 3 detik", "fetch('/api/state')", "let load = sys.load1;", "if (paused) return;",
    "robots.forEach(animate);", "export default office;", "const hud = update();", "while (ok) { poll(); }"];
  const cols = ["#7dd3fc", "#c4b5fd", "#86efac", "#fca5a5", "#8b8b93", "#fcd34d"];
  for (let i = 0; i < 14; i++) codeLines.push({ t: seeds[i % seeds.length], c: cols[i % cols.length] });
  drawCode();
}
function drawCode() {
  if (!codeCanvas) return;
  const x = codeCanvas.getContext("2d");
  x.fillStyle = "#0b0e14"; x.fillRect(0, 0, 320, 200);
  x.font = "11px ui-monospace, Menlo, monospace";
  codeLines.forEach((l, i) => { x.fillStyle = l.c; x.fillText(l.t, 12, 20 + i * 13); });
  codeTex.needsUpdate = true;
}
function pushCodeLine() {
  const seeds = ["await api.queue(prompt);", "syncFigures(state);", "lamp.color.set(ok);", "orbit.update(dt);",
    "raycast agents…", "hop(figure, 2);", "// idle: sway", "theta += dx*0.005;"];
  const cols = ["#7dd3fc", "#c4b5fd", "#86efac", "#fca5a5", "#fcd34d"];
  codeLines.shift();
  codeLines.push({ t: seeds[Math.floor(Math.random() * seeds.length)], c: cols[Math.floor(Math.random() * cols.length)] });
  drawCode();
}
function initChartMonitor() {
  chartCanvas = document.createElement("canvas"); chartCanvas.width = 320; chartCanvas.height = 200;
  chartTex = new THREE.CanvasTexture(chartCanvas);
  drawChart();
}
function drawChart() {
  if (!chartCanvas) return;
  const x = chartCanvas.getContext("2d"), w = 320, h = 200;
  x.fillStyle = "#0b0e14"; x.fillRect(0, 0, w, h);
  x.strokeStyle = "#1b1b22"; x.lineWidth = 1;
  for (let gy = 20; gy < h; gy += 30) { x.beginPath(); x.moveTo(0, gy); x.lineTo(w, gy); x.stroke(); }
  const wave = (color, amp, lw, ph) => {
    x.strokeStyle = color; x.lineWidth = lw; x.beginPath();
    for (let px = 0; px <= w; px += 4) {
      const py = h / 2 + Math.sin(px * 0.05 + ph) * amp + Math.sin(px * 0.013 + ph * 0.6) * amp * 0.6;
      px === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
    }
    x.stroke();
  };
  wave("rgba(52,211,153,0.35)", 26, 1.5, chartPhase * 0.7);
  wave("#38bdf8", 30, 2, chartPhase);
}

function drawWorldMapTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 256;
  const x = c.getContext("2d");
  x.fillStyle = "#101827"; x.fillRect(0, 0, 512, 256);
  /* Peta dunia titik-titik: gugus elips kasar per benua. */
  const blobs = [
    [110, 70, 60, 42], [180, 110, 42, 55], [300, 55, 78, 38], [330, 120, 45, 42],
    [395, 75, 42, 30], [430, 140, 34, 26], [255, 150, 30, 20]
  ];
  x.fillStyle = "#38bdf8";
  for (let gy = 12; gy < 200; gy += 9) for (let gx = 14; gx < 330; gx += 9) {
    let inMap = false;
    for (const b of blobs) {
      const dx = (gx - b[0]) / b[2], dy = (gy - b[1]) / b[3];
      if (dx * dx + dy * dy <= 1) { inMap = true; break; }
    }
    if (inMap) { x.globalAlpha = 0.55 + Math.random() * 0.45; x.fillRect(gx, gy, 5, 5); }
  }
  x.globalAlpha = 1;
  /* Grafik batang kiri bawah. */
  const bars = [18, 30, 24, 42, 36, 50, 44];
  bars.forEach((h, i) => {
    x.fillStyle = "rgba(56,189,248,0.85)";
    x.fillRect(20 + i * 18, 232 - h, 11, h);
  });
  /* Grafik garis kanan bawah. */
  x.strokeStyle = "#34d399"; x.lineWidth = 2; x.beginPath();
  const pts = [[360, 225], [385, 205], [410, 215], [435, 190], [460, 200], [485, 180]];
  pts.forEach((p, i) => { i === 0 ? x.moveTo(p[0], p[1]) : x.lineTo(p[0], p[1]); });
  x.stroke();
  /* Bilah stat kanan atas. */
  for (let i = 0; i < 4; i++) {
    x.fillStyle = "rgba(56,189,248,0.35)"; x.fillRect(360, 22 + i * 16, 110, 7);
    x.fillStyle = "#38bdf8"; x.fillRect(360, 22 + i * 16, 40 + i * 18, 7);
  }
  return new THREE.CanvasTexture(c);
}

function buildRoom() {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(26, 18),
    new THREE.MeshStandardMaterial({ map: drawFloorTexture(), roughness: 0.85, metalness: 0.0 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = shadowsOn; scene.add(floor);

  const backWallMat = new THREE.MeshStandardMaterial({ color: 0x7a4f27, roughness: 1 });
  const sideWallMat = new THREE.MeshStandardMaterial({ color: 0x8a5a2e, roughness: 1 });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(26, 9), backWallMat);
  back.position.set(0, 4.5, -6.5); scene.add(back);
  [-1, 1].forEach((s) => {
    const side = new THREE.Mesh(new THREE.PlaneGeometry(18, 9), sideWallMat);
    side.position.set(13 * s, 4.5, 0); side.rotation.y = -s * Math.PI / 2; scene.add(side);
  });
  /* Lis bawah dinding. */
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x4a2f18, roughness: 0.7 });
  const baseB = new THREE.Mesh(new THREE.BoxGeometry(26, 0.3, 0.08), baseMat);
  baseB.position.set(0, 0.15, -6.44); scene.add(baseB);
  [-1, 1].forEach((s) => {
    const baseS = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 18), baseMat);
    baseS.position.set(12.94 * s, 0.15, 0); scene.add(baseS);
  });

  /* Layar besar di dinding tengah (gaya The Agency): peta dunia + grafik. */
  const screenFrame = new THREE.Mesh(new THREE.BoxGeometry(8.6, 4.6, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x2c2c33, roughness: 0.6 }));
  screenFrame.position.set(0, 3.4, -6.46); scene.add(screenFrame);
  const bigScreen = new THREE.Mesh(new THREE.PlaneGeometry(8.2, 4.2),
    new THREE.MeshBasicMaterial({ map: drawWorldMapTexture() }));
  bigScreen.position.set(0, 3.4, -6.4); scene.add(bigScreen);

  /* Jendela kedua di dinding kiri (pegunungan senja). */
  const win2Frame = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 3.8),
    new THREE.MeshStandardMaterial({ color: 0x4a3220, roughness: 0.8 }));

/* ---------- Orbit manual ---------- */
function applyCamera() {
  const sp = Math.sin(orbitCur.phi), r = orbitCur.r;
  camera.position.set(
    orbitCur.tx + r * sp * Math.sin(orbitCur.theta),
    orbitCur.ty + r * Math.cos(orbitCur.phi),
    orbitCur.tz + r * sp * Math.cos(orbitCur.theta)
  );
  camera.lookAt(orbitCur.tx, orbitCur.ty, orbitCur.tz);
}
/* Haluskan kamera tiap frame menuju target orbit (drag/zoom terasa lembut, bukan lompat). */
function smoothCamera(dt) {
  const k = 1 - Math.exp(-6 * dt);
  ["tx", "ty", "tz", "r", "theta", "phi"].forEach((key) => { orbitCur[key] += (orbit[key] - orbitCur[key]) * k; });
  applyCamera();
}
function clampOrbit() {
  orbit.phi = Math.max(0.3, Math.min(1.45, orbit.phi));
  orbit.r = Math.max(5, Math.min(20, orbit.r));
}
function initControls(canvas) {
  const pts = new Map();
  let downX = 0, downY = 0, moved = false, lastPinch = 0;
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    downX = e.clientX; downY = e.clientY; moved = false; lastPinch = 0;
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) moved = true;
    if (pts.size === 1) {
      orbit.theta -= dx * 0.0052; orbit.phi -= dy * 0.0052; clampOrbit(); applyCamera();
    } else if (pts.size === 2) {
      const p = [...pts.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (lastPinch > 0) { orbit.r *= (1 - (d - lastPinch) * 0.0035); clampOrbit(); applyCamera(); }
      lastPinch = d;
    }
  });
  const up = (e) => {
    const wasClick = pts.has(e.pointerId) && !moved;
    pts.delete(e.pointerId);
    if (wasClick && e.type === "pointerup") onCanvasClick(e);
    if (pts.size < 2) lastPinch = 0;
  };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    orbit.r *= (1 + e.deltaY * 0.001); clampOrbit(); applyCamera();
  }, { passive: false });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
}
function onCanvasClick(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const ny = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera({ x: nx, y: ny }, camera);
  const hits = raycaster.intersectObjects(figureRoots, true);
  if (hits.length) {
    let o = hits[0].object;
    while (o && !o.userData.agentId) o = o.parent;
    if (o && o.userData.agentId) toggleAgentPause(o.userData.agentId);
  }
}

/* ---------- Sinkronisasi data → 3D (tanpa rebuild) ---------- */
function syncFigures() {
  if (!threeReady || !state || !Array.isArray(state.agents)) return;
  ROSTER.forEach((cfg, i) => {
    const r = figures3D[cfg.id]; if (!r) return;
    const a = state.agents.find((x) => x.id === cfg.id);
    const paused = !!(a && (a.paused || (state.paused_agents && state.paused_agents[cfg.id])));
    const working = !paused && !!a && a.status === "working";
    const d = deskOf(cfg);
    if (working) { r.userData.target.pos.set(d.x, -0.15, d.row.seatZ); r.userData.target.rotY = Math.PI; }
    else if (!r.userData.spot) { // di titik santai: posisi diatur animate(), bukan di sini
      r.userData.target.pos.set(d.x, 0, d.row.idleZ); r.userData.target.rotY = 0;
    }
    refreshBubble(r, cfg, a, paused);
    if (r.userData.paused !== paused) { r.userData.paused = paused; refreshLabel(r, cfg); }
    r.userData.working = working;
    if (working || paused) { // kegiatan santai batal: bebaskan titik + bersihkan state
      if (r.userData.spot) { spotTaken[r.userData.spot] = null; r.userData.spot = null; }
      r.userData.spotLegs = []; r.userData.spotArrived = false; r.userData.sitting = false;
      r.userData.leisure = "";
    }
    /* Cincin status: aksen agent saat working, kuning saat paused, redup saat idle. */
    if (r.userData.parts.ring) {
      const ringMat = r.userData.parts.ring.material;
      ringMat.color.setHex(paused ? 0xf59e0b : (working ? cfg.color : 0x3a3f4a));
      ringMat.opacity = paused ? 0.5 : (working ? 0.85 : 0.3);
    }
  });
  let col = 0x22c55e;
  if (state.dispatch_paused) col = 0xef4444;
  else if (state.system && state.system.cpu_count && state.system.load1 > state.system.cpu_count * 0.7) col = 0xf59e0b;
  lampMat.color.setHex(col); lampMat.emissive.setHex(col); lampLight.color.setHex(col);
}

/* ---------- Animasi ---------- */
var clk = null;
function relaxArm(arm, k) {
  arm.rotation.x += (0 - arm.rotation.x) * k;
  arm.rotation.z += (0 - arm.rotation.z) * k;
}
function animate() {
  requestAnimationFrame(animate);
  if (!threeReady) return;
  const dt = Math.min(clk.getDelta(), 0.05), t = clk.elapsedTime;
  if (!officeVisible()) return;
  const k = 1 - Math.exp(-4 * dt);
  smoothCamera(dt);

  Object.keys(figures3D).forEach((id) => {
    const r = figures3D[id], u = r.userData, P = u.parts, tp = u.target;
    r.position.x += (tp.pos.x - r.position.x) * k;
    r.position.z += (tp.pos.z - r.position.z) * k;
    let yOff = 0;
    if (u.hop > 0) {
      u.hopT += dt; const hd = 0.55;
      yOff = Math.abs(Math.sin((u.hopT / hd) * Math.PI)) * 0.5;
      if (u.hopT >= hd) { u.hopT = 0; u.hop--; }
    }
    let yT = tp.pos.y + yOff;
    if (!u.working && !u.paused && !u.sitting) yT += Math.sin(t * 1.6 + u.phase) * 0.03;
    r.position.y += (yT - r.position.y) * k;
    /* Kaki: duduk (paha ke depan, betis tegak) saat working atau duduk santai. */
    if (P.thighL) {
      const legT = (u.working || u.sitting) ? -1.35 : 0;
      P.thighL.rotation.x += (legT - P.thighL.rotation.x) * k;
      P.thighR.rotation.x += (legT - P.thighR.rotation.x) * k;
      const kneeT = (u.working || u.sitting) ? 1.35 : 0;
      P.kneeL.rotation.x += (kneeT - P.kneeL.rotation.x) * k;
      P.kneeR.rotation.x += (kneeT - P.kneeR.rotation.x) * k;
    }
    /* Cincin status: tetap di lantai mengikuti x/z figur (bukan anak grup),
       berdenyut saat working; diam saat idle/paused. */
    if (P.ring) {
      const pulse = u.working && !u.paused ? 1 + Math.sin(t * 3.5) * 0.07 : 1;
      P.ring.scale.setScalar(pulse);
      P.ring.position.set(r.position.x, 0.02, r.position.z);
    }
    /* ---------- Kegiatan santai saat idle (v8 kabin) ----------
       In-place: meregang, minum kopi, menoleh ke layar besar, mengobrol.
       Titik santai: baca (kursi perapian), jendela (lihat pegunungan),
       karpet (duduk + minum) — figur BERJALAN ke titik lewat koridor
       depan (z 5,2) supaya tidak menembus meja, lalu kembali ke meja
       saat kegiatan selesai / ada tugas / dijeda. */
    const endLeisure = () => { // bebaskan titik + kembalikan target ke meja
      if (u.spot) { spotTaken[u.spot] = null; u.spot = null; }
      u.spotLegs = []; u.spotArrived = false; u.sitting = false;
      u.leisure = ""; u.leisureNext = t + 3 + Math.random() * 5;
      const cfgE = ROSTER.find((c) => c.id === id), dE = deskOf(cfgE);
      if (u.working) { tp.pos.set(dE.x, -0.15, dE.row.seatZ); tp.rotY = Math.PI; }
      else { tp.pos.set(dE.x, 0, dE.row.idleZ); tp.rotY = 0; }
    };
    if (!u.working && !u.paused) {
      if (!u.leisure && t > (u.leisureNext || 0)) {
        const acts = ["stretch", "sip", "look", "chat"];
        ["read", "window", "rug"].forEach((sk) => { if (!spotTaken[sk]) acts.push(sk); });
        u.leisure = acts[Math.floor(Math.random() * acts.length)];
        u.leisureT = 2.5 + Math.random() * 2;
        u.spot = null; u.spotLegs = []; u.spotArrived = false; u.sitting = false;
        if (u.leisure === "chat") { // tetangga: kolom sebelah di baris yang sama
          const idxL = ROSTER.findIndex((c) => c.id === id);
          const rowL = idxL < 3 ? 0 : 1, colL = idxL % 3;
          const nCol = colL < 2 ? colL + 1 : colL - 1;
          u.chatRotY = DESK_X[rowL][nCol] > DESK_X[rowL][colL] ? Math.PI / 2 : -Math.PI / 2;
        }
        if (LEISURE_SPOTS[u.leisure]) { // titik santai: klaim + rute 2 kaki
          const sp = LEISURE_SPOTS[u.leisure];
          spotTaken[u.leisure] = id;
          u.spot = u.leisure;
          u.spotLegs = [{ x: r.position.x, z: 5.2 }, { x: sp.x, z: 5.2 }, { x: sp.x, z: sp.z }];
          u.walkT = 0;
        }
      }
      if (u.leisure) {
        if (u.spot && !u.spotArrived) { // masih berjalan: timer baru jalan setelah tiba
          u.walkT += dt;
          if (u.walkT > 6) endLeisure(); // jalan terlalu lama: batalkan
        } else {
          u.leisureT -= dt;
          if (u.leisureT <= 0) endLeisure();
        }
      }
    } else {
      if (u.leisure || u.spot) endLeisure();
    }
    u.sitting = ((u.leisure === "read" || u.leisure === "rug") && u.spotArrived);
    if (P.handMug) P.handMug.visible = (u.leisure === "sip" || u.leisure === "rug");
    if (P.book) P.book.visible = (u.leisure === "read" && u.spotArrived);
    /* Berjalan ke titik santai: ikuti kaki rute, hadap arah jalan. */
    let rotT = tp.rotY;
    if (u.spot && !u.spotArrived) {
      const leg = u.spotLegs[0];
      if (leg) {
        tp.pos.set(leg.x, tp.pos.y, leg.z);
        const dxl = leg.x - r.position.x, dzl = leg.z - r.position.z;
        if (Math.hypot(dxl, dzl) > 0.05) rotT = Math.atan2(dxl, dzl);
        if (Math.hypot(dxl, dzl) < 0.35) {
          u.spotLegs.shift();
          if (!u.spotLegs.length) {
            const sp = LEISURE_SPOTS[u.spot];
            u.spotArrived = true;
            tp.pos.set(sp.x, sp.y, sp.z); tp.rotY = sp.rotY;
          }
        }
      }
    }
    /* Kegiatan "look"/"chat": badan menghadap layar besar / tetangga sebelah. */
    if (u.leisure === "look") rotT = Math.PI;
    else if (u.leisure === "chat") rotT = u.chatRotY || 0;
    let dr = rotT - r.rotation.y;
    dr = Math.atan2(Math.sin(dr), Math.cos(dr));
    r.rotation.y += dr * k;

    if (!u.paused && P.eyeL) { // kedip mata
      if (t > u.blinkT) { u.blinkUntil = t + 0.12; u.blinkT = t + 2 + Math.random() * 3; }
      const s = t < u.blinkUntil ? 0.12 : 1;
      P.eyeL.scale.y += (s - P.eyeL.scale.y) * 0.5; P.eyeR.scale.y = P.eyeL.scale.y;
    }
    if (!u.working && !u.paused) { // idle: kepala bergoyang lembut
      P.headG.rotation.y += (Math.sin(t * 1.1 + u.phase) * 0.14 - P.headG.rotation.y) * k;
    } else if (id !== "Jaka" || !u.working) {
      P.headG.rotation.y += (0 - P.headG.rotation.y) * k;
    }

    if (u.working && !u.paused) {
      P.headG.rotation.x += (0 - P.headG.rotation.x) * k; // kembali tegak dari kegiatan santai
      if (id === "Dani" || id === "Anca") { // mengetik
        P.armR.rotation.x = -1.0 + Math.sin(t * 13) * 0.35;
        P.armL.rotation.x = -1.0 + Math.sin(t * 13 + 1.6) * 0.35;
        P.armR.rotation.z = 0; P.armL.rotation.z = 0;
      } else if (id === "Mu") { // menggambar
        P.armR.rotation.x = -1.15; P.armR.rotation.z = Math.sin(t * 2.4) * 0.55;
        P.armL.rotation.x += (-0.45 - P.armL.rotation.x) * k;
      } else if (id === "Cipu") { // mengangguk + REC
        P.headG.position.y = 1.86 + Math.abs(Math.sin(t * 5.2)) * 0.07;
        P.headG.rotation.z = Math.sin(t * 2.6) * 0.07;
        relaxArm(P.armL, k); relaxArm(P.armR, k);
      } else if (id === "Jaka") { // lensa pulse + scan
        if (P.lensG) P.lensG.scale.setScalar(1 + Math.sin(t * 3.2) * 0.09);
        P.headG.rotation.y = Math.sin(t * 0.8) * 0.45;
        relaxArm(P.armL, k); relaxArm(P.armR, k);
      } else if (id === "Tono") { // angkat kaca pembesar
        P.armR.rotation.x += (-1.65 - P.armR.rotation.x) * k;
        P.armR.rotation.z += (0 - P.armR.rotation.z) * k;
        relaxArm(P.armL, k);
      } else { relaxArm(P.armL, k); relaxArm(P.armR, k); }
    } else if (u.leisure === "stretch") { // meregang: kedua tangan ke atas, kepala menengadah
      P.armL.rotation.x += (-2.4 - P.armL.rotation.x) * k;
      P.armR.rotation.x += (-2.4 - P.armR.rotation.x) * k;
      P.armL.rotation.z += (-0.5 - P.armL.rotation.z) * k;
      P.armR.rotation.z += (0.5 - P.armR.rotation.z) * k;
      P.headG.rotation.x += (-0.28 - P.headG.rotation.x) * k;
    } else if (u.leisure === "sip") { // minum kopi: tangan kanan terangkat ke mulut
      P.armR.rotation.x += (-1.9 - P.armR.rotation.x) * k;
      P.armR.rotation.z += (0 - P.armR.rotation.z) * k;
      P.headG.rotation.x += (-0.15 - P.headG.rotation.x) * k;
      relaxArm(P.armL, k);
    } else if (u.leisure === "look") { // menoleh ke layar besar: kepala mendongak
      P.headG.rotation.x += (-0.12 - P.headG.rotation.x) * k;
      relaxArm(P.armL, k); relaxArm(P.armR, k);
    } else if (u.leisure === "chat") { // mengobrol: mengangguk pelan
      P.headG.position.y = 1.86 + Math.abs(Math.sin(t * 4)) * 0.05;
      P.headG.rotation.x += (0 - P.headG.rotation.x) * k;
      relaxArm(P.armL, k); relaxArm(P.armR, k);
    } else if (u.leisure === "read" && u.spotArrived) { // baca di kursi perapian
      P.armL.rotation.x += (-1.1 - P.armL.rotation.x) * k;
      P.armR.rotation.x += (-1.1 - P.armR.rotation.x) * k;
      P.armL.rotation.z += (0 - P.armL.rotation.z) * k;
      P.armR.rotation.z += (0 - P.armR.rotation.z) * k;
      P.headG.rotation.x += (0.15 - P.headG.rotation.x) * k; // menunduk ke buku
    } else if (u.leisure === "window" && u.spotArrived) { // lihat pegunungan
      P.headG.rotation.x += (-0.12 - P.headG.rotation.x) * k;
      relaxArm(P.armL, k); relaxArm(P.armR, k);
    } else if (u.leisure === "rug" && u.spotArrived) { // duduk di karpet + minum
      P.armR.rotation.x += (-1.9 - P.armR.rotation.x) * k;
      P.armR.rotation.z += (0 - P.armR.rotation.z) * k;
      P.headG.rotation.x += (-0.15 - P.headG.rotation.x) * k;
      relaxArm(P.armL, k);
    } else {
      relaxArm(P.armL, k); relaxArm(P.armR, k);
      P.headG.rotation.x += (0 - P.headG.rotation.x) * k;
      P.headG.position.y += (1.86 - P.headG.position.y) * k;
      if (id === "Cipu") {
        P.headG.rotation.z += (0 - P.headG.rotation.z) * k;
      }
      if (id === "Jaka" && P.lensG) {
        const s = P.lensG.scale.x; P.lensG.scale.setScalar(s + (1 - s) * k);
      }
    }
    if (id === "Cipu" && P.recMat) {
      P.recMat.emissiveIntensity = (u.working && !u.paused) ? (Math.sin(t * 9) > 0 ? 2.2 : 0.25) : 0.6;
    }
  });

  /* Api perapian berkedip (v8). */
  if (fireLight) {
    fireLight.intensity = 0.85 + Math.sin(t * 7.3) * 0.15 + Math.sin(t * 13.7) * 0.08;
  }
  flameMats.forEach((fm, fi) => {
    fm.emissiveIntensity = (fi === 0 ? 2.2 : fi === 1 ? 2.6 : 3.0) * (0.9 + Math.sin(t * 9 + fi * 2.1) * 0.12);
  });

  chartPhase += dt * 1.4; drawChart();
  renderer.render(scene, camera);
}

/* ---------- Resize ---------- */
function onResize3D() {
  if (!threeReady) return;
  const wrap = $("#gl-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}

/* ---------- Init ---------- */
function init3D() {
  const canvas = $("#gl");
  if (typeof THREE === "undefined") {
    $("#gl-wrap").innerHTML = '<div class="gl-fallback">Three.js gagal dimuat — periksa file /vendor/three.min.js di server.</div>';
    return;
  }
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x1a120b);
  /* Tone mapping filmik: highlight tidak ter-clip jadi putih. */
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  /* Bayangan lembut, hanya desktop (shadowsOn) agar HP tidak berat. */
  renderer.shadowMap.enabled = shadowsOn;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x1a120b, 26, 48);
  camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
  raycaster = new THREE.Raycaster();
  clk = new THREE.Clock();
  applyCamera();

  scene.add(new THREE.AmbientLight(0xffd9a0, 0.28));
  scene.add(new THREE.HemisphereLight(0x8a6a4a, 0x1a120b, 0.3));
  const key = new THREE.DirectionalLight(0xffe0b0, 0.6); key.position.set(6, 9, 7); scene.add(key);
  if (shadowsOn) {
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -12; key.shadow.camera.right = 12;
    key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
    key.shadow.camera.near = 1; key.shadow.camera.far = 30;
    key.shadow.bias = -0.0005;
  }
  /* Lampu rim dingin samar dari jendela, supaya siluet figur tidak rata. */
  const rim = new THREE.DirectionalLight(0x9fb8d8, 0.25); rim.position.set(-7, 6, -6); scene.add(rim);
  const warm = new THREE.PointLight(0xffb45e, 0.65, 22); warm.position.set(0, 4.5, 1.5); scene.add(warm);

  buildRoom();
  ROSTER.forEach((cfg) => {
    const r = buildVoxel(cfg);
    figures3D[cfg.id] = r; figureRoots.push(r); scene.add(r);
  });

  initControls(canvas);
  threeReady = true;
  onResize3D();
  if (window.ResizeObserver) new ResizeObserver(onResize3D).observe($("#gl-wrap"));
  animate();
}

/* ---------- Boot ---------- */
buildNav();
tickClock(); setInterval(tickClock, 1000);
updateOfficeMode();
init3D();
setInterval(poll, 3000);
poll();
</script>
